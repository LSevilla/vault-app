<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="theme-color" content="#0a0a0f">
<title>Vault – Gestor de Contraseñas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --card: #1a1a24;
  --card2: #1f1f2e;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --accent: #6c63ff;
  --accent2: #8b85ff;
  --accent-glow: rgba(108,99,255,0.25);
  --text: #f0f0f8;
  --text2: #9494aa;
  --text3: #5a5a72;
  --success: #22c68a;
  --warn: #f5a623;
  --danger: #ff4d6a;
  --radius: 14px;
  --radius-sm: 8px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── LOCK SCREEN ── */
#lock-screen {
  min-height: 100vh;
  min-height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: radial-gradient(ellipse at 50% 0%, rgba(108,99,255,0.18) 0%, transparent 60%);
}
.lock-logo {
  width: 88px; height: 88px;
  background: linear-gradient(135deg, #6c63ff, #9f97ff);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  margin-bottom: 1.5rem;
  box-shadow: 0 0 48px rgba(108,99,255,0.4);
}
.lock-title { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.lock-sub { color: var(--text2); font-size: 15px; margin-bottom: 2.5rem; }
.pin-label { color: var(--text3); font-size: 13px; margin-bottom: 16px; letter-spacing: 0.3px; }
.pin-dots { display: flex; gap: 18px; margin-bottom: 2.5rem; }
.pin-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--border2);
  background: transparent;
  transition: all 0.2s;
}
.pin-dot.filled {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 14px var(--accent-glow);
}
.pin-dot.shake { animation: shake 0.4s ease; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 290px;
}
.pin-btn {
  height: 72px; border-radius: 50%;
  background: var(--card);
  border: 0.5px solid var(--border2);
  color: var(--text); font-size: 24px; font-weight: 300;
  cursor: pointer; transition: all 0.15s;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px;
  -webkit-user-select: none;
}
.pin-btn sub { font-size: 9px; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; }
.pin-btn:active { background: var(--accent); transform: scale(0.94); border-color: var(--accent); }
.pin-btn.del { background: transparent; border-color: transparent; font-size: 20px; color: var(--text2); }
.pin-btn.zero { grid-column: 2; }
.pin-error { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 12px; text-align: center; }
.pin-hint { color: var(--text3); font-size: 12px; margin-top: 20px; }

/* ── MAIN APP ── */
#app { display: none; min-height: 100vh; padding-bottom: 95px; }

/* HEADER */
.app-header {
  padding: 54px 20px 14px;
  position: sticky; top: 0; z-index: 10;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  background: rgba(10,10,15,0.88);
  border-bottom: 0.5px solid var(--border);
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.header-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.header-badge {
  background: rgba(108,99,255,0.15);
  border: 0.5px solid rgba(108,99,255,0.4);
  color: var(--accent2); font-size: 12px; padding: 5px 11px; border-radius: 20px;
}
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 0.5px solid var(--border);
  border-radius: 10px; padding: 9px 13px;
}
.search-bar input {
  background: none; border: none; outline: none; color: var(--text);
  font-size: 15px; flex: 1; font-family: inherit;
}
.search-bar input::placeholder { color: var(--text3); }

/* ALERT */
.alert-banner {
  margin: 12px 16px 0;
  background: rgba(245,166,35,0.1);
  border: 0.5px solid rgba(245,166,35,0.35);
  border-radius: 10px; padding: 11px 14px;
  display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
.alert-text { font-size: 13px; color: var(--warn); flex: 1; line-height: 1.4; }

/* CATEGORIES */
.categories {
  display: flex; gap: 8px; padding: 14px 16px 0;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.categories::-webkit-scrollbar { display: none; }
.cat-chip {
  padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
  border: 0.5px solid var(--border); background: var(--card);
  cursor: pointer; white-space: nowrap; transition: all 0.2s; color: var(--text2);
  display: flex; align-items: center; gap: 6px;
}
.cat-chip.active { color: var(--text); border-color: var(--accent); background: rgba(108,99,255,0.15); }
.cat-dot { width: 7px; height: 7px; border-radius: 50%; }

/* LIST */
.section-label {
  font-size: 11px; color: var(--text3); padding: 16px 16px 8px;
  letter-spacing: 0.6px; text-transform: uppercase; font-weight: 500;
}
.pw-card {
  margin: 0 16px 8px;
  background: var(--card); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  cursor: pointer; transition: all 0.18s;
  display: flex; align-items: center; gap: 14px;
  -webkit-user-select: none;
}
.pw-card:active { background: var(--card2); transform: scale(0.985); }
.pw-icon {
  width: 46px; height: 46px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.pw-info { flex: 1; min-width: 0; }
.pw-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.pw-user { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pw-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.pw-age { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.pw-age.ok    { background: rgba(34,198,138,0.12); color: var(--success); }
.pw-age.warn  { background: rgba(245,166,35,0.12);  color: var(--warn); }
.pw-age.danger{ background: rgba(255,77,106,0.15);  color: var(--danger); }
.pw-chevron { color: var(--text3); font-size: 18px; font-weight: 300; }

/* FAB */
.fab {
  position: fixed; bottom: 104px; right: 20px;
  width: 58px; height: 58px; border-radius: 29px;
  background: var(--accent); border: none;
  color: white; font-size: 28px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 24px var(--accent-glow);
  transition: transform 0.18s; z-index: 20;
}
.fab:active { transform: scale(0.91); }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  height: 88px;
  background: rgba(19,19,26,0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 0.5px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-around;
  padding-top: 12px; z-index: 15;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 0 24px; }
.nav-icon { font-size: 24px; }
.nav-label { font-size: 10px; color: var(--text3); font-weight: 500; }
.nav-item.active .nav-label { color: var(--accent2); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 50; display: none; align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  width: 100%; background: var(--surface);
  border-radius: 24px 24px 0 0;
  border-top: 0.5px solid var(--border2);
  padding: 10px 0 48px; max-height: 94vh; overflow-y: auto;
  animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
  -webkit-overflow-scrolling: touch;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border2); margin: 0 auto 14px; }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 16px; border-bottom: 0.5px solid var(--border);
}
.modal-title { font-size: 18px; font-weight: 600; }
.modal-close {
  background: var(--card2); border: none; color: var(--text2);
  width: 30px; height: 30px; border-radius: 15px; cursor: pointer; font-size: 14px;
}
.modal-body { padding: 20px; }

/* DETAIL */
.detail-icon {
  width: 76px; height: 76px; border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; margin: 0 auto 14px;
}
.detail-name  { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.detail-cat   { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.detail-age   { text-align: center; font-size: 13px; margin-bottom: 22px; font-weight: 500; }

.detail-field { margin-bottom: 14px; }
.field-label  { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; font-weight: 500; }
.field-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 0.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px;
}
.field-value { flex: 1; font-size: 15px; font-family: 'Courier New', monospace; letter-spacing: 1px; word-break: break-all; }
.field-value.hidden { filter: blur(8px); user-select: none; -webkit-user-select: none; }
.field-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px 6px; }

.strength-wrap { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.strength-bar { height: 4px; border-radius: 2px; flex: 1; }
.strength-bar.strong { background: linear-gradient(90deg, var(--success), #0de88a); }
.strength-bar.medium { background: linear-gradient(90deg, var(--warn), #ffcc44); }
.strength-bar.weak   { background: linear-gradient(90deg, var(--danger), #ff7a90); }

.detail-actions { display: flex; gap: 10px; margin-top: 22px; }
.action-btn {
  flex: 1; padding: 15px; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.18s;
  font-family: inherit;
}
.action-btn.primary { background: var(--accent); border: none; color: white; }
.action-btn.primary:active { transform: scale(0.97); opacity: 0.9; }
.action-btn.danger-btn { background: rgba(255,77,106,0.1); border: 0.5px solid rgba(255,77,106,0.3); color: var(--danger); }
.action-btn.danger-btn:active { background: rgba(255,77,106,0.2); }

/* FORM */
.form-field   { margin-bottom: 16px; }
.form-label   { font-size: 13px; color: var(--text2); margin-bottom: 7px; display: block; font-weight: 500; }
.form-input {
  width: 100%; background: var(--card); border: 0.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 14px;
  color: var(--text); font-size: 16px; font-family: inherit; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.form-input:focus { border-color: var(--accent); }
.form-select {
  width: 100%; background: var(--card); border: 0.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 14px;
  color: var(--text); font-size: 16px; font-family: inherit; outline: none;
  -webkit-appearance: none; appearance: none;
}
.pw-field-row { display: flex; gap: 8px; }
.pw-field-row .form-input { flex: 1; }
.gen-btn {
  background: rgba(108,99,255,0.15); border: 0.5px solid rgba(108,99,255,0.4);
  color: var(--accent2); padding: 0 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
}
.gen-btn:active { background: rgba(108,99,255,0.25); }
.save-btn {
  width: 100%; padding: 17px; border-radius: var(--radius);
  background: var(--accent); border: none; color: white;
  font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
  font-family: inherit; letter-spacing: 0.2px;
}
.save-btn:active { transform: scale(0.98); opacity: 0.9; }

/* SECURITY */
.security-score {
  margin: 4px 16px 16px;
  background: var(--card); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 22px; text-align: center;
}
.score-ring  { font-size: 52px; font-weight: 200; margin-bottom: 4px; }
.score-label { font-size: 13px; color: var(--text2); }
.score-progress { margin-top: 14px; height: 6px; background: var(--card2); border-radius: 3px; }
.score-progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

.sec-item {
  margin: 0 16px 8px;
  background: var(--card); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.sec-icon { font-size: 22px; width: 38px; text-align: center; flex-shrink: 0; }
.sec-info { flex: 1; }
.sec-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.sec-desc { font-size: 12px; color: var(--text2); line-height: 1.4; }
.sec-badge { font-size: 11px; padding: 4px 9px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.sec-badge.ok  { background: rgba(34,198,138,0.12); color: var(--success); }
.sec-badge.bad { background: rgba(255,77,106,0.14); color: var(--danger); }

/* SETTINGS */
.settings-info {
  margin: 12px 16px; padding: 14px;
  background: rgba(108,99,255,0.08); border: 0.5px solid rgba(108,99,255,0.2);
  border-radius: var(--radius); font-size: 12px; color: var(--text2); line-height: 1.7;
}
.toggle-track {
  width: 46px; height: 28px; background: var(--accent);
  border-radius: 14px; position: relative; cursor: pointer; flex-shrink: 0;
}
.toggle-thumb {
  width: 24px; height: 24px; background: white; border-radius: 12px;
  position: absolute; top: 2px; right: 2px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* EMPTY */
.empty { text-align: center; padding: 64px 20px; color: var(--text3); }
.empty-icon { font-size: 52px; margin-bottom: 14px; }
.empty-title { font-size: 17px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
.empty-sub { font-size: 13px; }

/* TOAST */
.copy-toast {
  position: fixed; bottom: 114px; left: 50%; transform: translateX(-50%);
  background: #22c68a; color: white; padding: 10px 22px;
  border-radius: 22px; font-size: 14px; font-weight: 600;
  z-index: 200; opacity: 0; transition: opacity 0.25s; pointer-events: none;
  white-space: nowrap;
}
.copy-toast.show { opacity: 1; }

/* CONFIRM DIALOG */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px); z-index: 100;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: var(--surface); border: 0.5px solid var(--border2);
  border-radius: 18px; padding: 24px; width: 100%; max-width: 320px; text-align: center;
}
.confirm-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.confirm-msg { font-size: 14px; color: var(--text2); line-height: 1.5; margin-bottom: 22px; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btn {
  flex: 1; padding: 13px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; border: none;
}
.confirm-btn.cancel { background: var(--card2); color: var(--text2); }
.confirm-btn.ok { background: var(--danger); color: white; }
</style>
</head>
<body>

<!-- ══ LOCK SCREEN ══ -->
<div id="lock-screen">
  <div class="lock-logo">🔐</div>
  <div class="lock-title">Vault</div>
  <div class="lock-sub">Gestor seguro de contraseñas</div>
  <div class="pin-label">Ingresa tu PIN de 4 dígitos</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" ontouchstart="pinPress('1')">1</button>
    <button class="pin-btn" ontouchstart="pinPress('2')">2<sub>ABC</sub></button>
    <button class="pin-btn" ontouchstart="pinPress('3')">3<sub>DEF</sub></button>
    <button class="pin-btn" ontouchstart="pinPress('4')">4<sub>GHI</sub></button>
    <button class="pin-btn" ontouchstart="pinPress('5')">5<sub>JKL</sub></button>
    <button class="pin-btn" ontouchstart="pinPress('6')">6<sub>MNO</sub></button>
    <button class="pin-btn" ontouchstart="pinPress('7')">7<sub>PQRS</sub></button>
    <button class="pin-btn" ontouchstart="pinPress('8')">8<sub>TUV</sub></button>
    <button class="pin-btn" ontouchstart="pinPress('9')">9<sub>WXYZ</sub></button>
    <button class="pin-btn zero" ontouchstart="pinPress('0')">0</button>
    <button class="pin-btn del" ontouchstart="pinDel()">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-hint">PIN por defecto: 1234 — cámbialo en Ajustes</div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app">
  <div class="app-header">
    <div class="header-top">
      <div class="header-title">🔐 Vault</div>
      <div class="header-badge" id="count-badge">0 claves</div>
    </div>
    <div class="search-bar">
      <span style="font-size:15px;color:var(--text3);">🔍</span>
      <input type="text" placeholder="Buscar contraseña..." id="search-input" oninput="renderList()">
    </div>
  </div>

  <div id="alert-container"></div>
  <div class="categories" id="categories"></div>
  <div id="list-container"></div>

  <button class="fab" ontouchstart="openAdd()">+</button>

  <div class="bottom-nav">
    <div class="nav-item active" ontouchstart="switchTab('home')" id="tab-home">
      <div class="nav-icon">🏠</div><div class="nav-label">Inicio</div>
    </div>
    <div class="nav-item" ontouchstart="switchTab('security')" id="tab-security">
      <div class="nav-icon">🛡️</div><div class="nav-label">Seguridad</div>
    </div>
    <div class="nav-item" ontouchstart="switchTab('settings')" id="tab-settings">
      <div class="nav-icon">⚙️</div><div class="nav-label">Ajustes</div>
    </div>
  </div>
</div>

<!-- ══ DETAIL MODAL ══ -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="dm-title">Detalle</div>
      <button class="modal-close" ontouchstart="closeModal('detail-modal')">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<!-- ══ ADD/EDIT MODAL ══ -->
<div class="modal-overlay" id="form-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="fm-title">Nueva clave</div>
      <button class="modal-close" ontouchstart="closeModal('form-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Nombre del servicio</label>
        <input class="form-input" id="f-name" type="text" placeholder="Ej: Banco Santander" autocomplete="off">
      </div>
      <div class="form-field">
        <label class="form-label">Usuario / Email</label>
        <input class="form-input" id="f-user" type="text" placeholder="usuario@email.com" autocomplete="off" autocapitalize="none">
      </div>
      <div class="form-field">
        <label class="form-label">Contraseña</label>
        <div class="pw-field-row">
          <input class="form-input" id="f-pass" type="password" placeholder="••••••••" autocomplete="new-password" oninput="updateStrengthIndicator()">
          <button class="gen-btn" ontouchstart="generatePass()">⚡ Generar</button>
        </div>
        <div id="strength-indicator"></div>
      </div>
      <div class="form-field">
        <label class="form-label">Categoría</label>
        <select class="form-select" id="f-cat">
          <option value="bank">🏦 Banco</option>
          <option value="tc">💳 Tarjeta de crédito</option>
          <option value="entertain">🎬 Entretenimiento</option>
          <option value="social">📱 Redes sociales</option>
          <option value="work">💼 Trabajo</option>
          <option value="other">🔑 Otro</option>
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Notas (opcional)</label>
        <input class="form-input" id="f-notes" type="text" placeholder="Información adicional..." autocomplete="off">
      </div>
      <input type="hidden" id="f-id">
      <button class="save-btn" ontouchstart="saveEntry()">💾 Guardar de forma segura</button>
    </div>
  </div>
</div>

<!-- ══ CHANGE PIN MODAL ══ -->
<div class="modal-overlay" id="pin-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Cambiar PIN</div>
      <button class="modal-close" ontouchstart="closeModal('pin-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">PIN actual</label>
        <input class="form-input" id="pin-current" type="password" placeholder="••••" maxlength="4" pattern="[0-9]*" inputmode="numeric">
      </div>
      <div class="form-field">
        <label class="form-label">Nuevo PIN</label>
        <input class="form-input" id="pin-new" type="password" placeholder="••••" maxlength="4" pattern="[0-9]*" inputmode="numeric">
      </div>
      <div class="form-field">
        <label class="form-label">Confirmar nuevo PIN</label>
        <input class="form-input" id="pin-confirm" type="password" placeholder="••••" maxlength="4" pattern="[0-9]*" inputmode="numeric">
      </div>
      <div class="pin-error" id="pin-change-error" style="margin-bottom:12px;"></div>
      <button class="save-btn" ontouchstart="changePin()">Cambiar PIN</button>
    </div>
  </div>
</div>

<!-- ══ CONFIRM ══ -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">Eliminar contraseña</div>
    <div class="confirm-msg">¿Estás seguro? Esta acción no se puede deshacer.</div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" ontouchstart="closeConfirm()">Cancelar</button>
      <button class="confirm-btn ok" id="confirm-ok-btn">Eliminar</button>
    </div>
  </div>
</div>

<div class="copy-toast" id="toast">✓ Copiado al portapapeles</div>

<script>
// ── CONFIG ──
const CATEGORIES = {
  bank:      { label:'Banco',        emoji:'🏦', color:'#6c63ff' },
  tc:        { label:'Tarjeta crédito', emoji:'💳', color:'#f5a623' },
  entertain: { label:'Entretenimiento', emoji:'🎬', color:'#22c68a' },
  social:    { label:'Redes sociales',  emoji:'📱', color:'#e24b8a' },
  work:      { label:'Trabajo',      emoji:'💼', color:'#378add' },
  other:     { label:'Otro',         emoji:'🔑', color:'#888780' }
};

const STORAGE_KEY = 'vault_entries_v2';
const PIN_KEY     = 'vault_pin_v1';
const ATTEMPTS_KEY= 'vault_attempts';
const MAX_ATTEMPTS = 10;

// ── PIN ──
let pinEntry = '';
let failedAttempts = parseInt(localStorage.getItem(ATTEMPTS_KEY) || '0');

function getPin() { return localStorage.getItem(PIN_KEY) || '1234'; }

function pinPress(d) {
  if (pinEntry.length >= 4) return;
  pinEntry += d;
  updateDots();
  if (pinEntry.length === 4) {
    setTimeout(() => {
      if (pinEntry === getPin()) {
        localStorage.setItem(ATTEMPTS_KEY, '0');
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        renderAll();
      } else {
        failedAttempts++;
        localStorage.setItem(ATTEMPTS_KEY, failedAttempts);
        if (failedAttempts >= MAX_ATTEMPTS) {
          // Wipe all data
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(PIN_KEY);
          localStorage.removeItem(ATTEMPTS_KEY);
          document.getElementById('pin-error').textContent = '⚠️ Demasiados intentos. Datos borrados por seguridad.';
        } else {
          const left = MAX_ATTEMPTS - failedAttempts;
          document.getElementById('pin-error').textContent = `PIN incorrecto. ${left} intento${left!==1?'s':''} restante${left!==1?'s':''}.`;
          document.querySelectorAll('.pin-dot').forEach(d => d.classList.add('shake'));
          setTimeout(() => document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('shake')), 500);
        }
        pinEntry = '';
        updateDots();
      }
    }, 180);
  }
}

function pinDel() {
  if (pinEntry.length > 0) { pinEntry = pinEntry.slice(0,-1); updateDots(); }
}

function updateDots() {
  for(let i=0;i<4;i++) {
    document.getElementById('d'+i).className = 'pin-dot' + (i<pinEntry.length?' filled':'');
  }
  if (pinEntry.length < 4) document.getElementById('pin-error').textContent = '';
}

// ── DATA ──
let entries = [];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) entries = JSON.parse(raw);
  } catch(e) { entries = []; }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
}

function getDaysSince(dateStr) {
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

function newId() {
  return typeof crypto !== 'undefined' && crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ── STATE ──
let activeTab = 'home';
let activeCategory = 'all';

// ── RENDER ──
function renderAll() {
  renderAlerts();
  renderCategories();
  renderList();
  updateBadge();
}

function updateBadge() {
  const n = entries.length;
  document.getElementById('count-badge').textContent = n + ' clave' + (n!==1?'s':'');
}

function renderAlerts() {
  const c = document.getElementById('alert-container');
  if (activeTab !== 'home') { c.innerHTML=''; return; }
  const expired = entries.filter(e => getDaysSince(e.updatedAt) > 180);
  c.innerHTML = expired.length > 0
    ? `<div class="alert-banner" ontouchstart="switchTab('security')">
        <div class="alert-dot"></div>
        <div class="alert-text">⚠️ ${expired.length} clave${expired.length>1?'s':''} sin actualizar hace más de 6 meses — toca para ver</div>
        <span style="color:var(--warn);font-size:18px;">›</span>
       </div>` : '';
}

function renderCategories() {
  const c = document.getElementById('categories');
  if (activeTab !== 'home') { c.innerHTML=''; return; }
  let html = `<div class="cat-chip ${activeCategory==='all'?'active':''}" ontouchstart="setCategory('all')">Todas</div>`;
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    if (entries.some(e => e.category===key)) {
      html += `<div class="cat-chip ${activeCategory===key?'active':''}" ontouchstart="setCategory('${key}')">
        <span class="cat-dot" style="background:${cat.color}"></span>${cat.emoji} ${cat.label}
      </div>`;
    }
  });
  c.innerHTML = html;
}

function setCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderList();
}

function switchTab(tab) {
  activeTab = tab;
  ['home','security','settings'].forEach(t => {
    document.getElementById('tab-'+t).className = 'nav-item'+(t===tab?' active':'');
  });
  renderAll();
}

function renderList() {
  const c = document.getElementById('list-container');
  if (activeTab==='security') { renderSecurity(c); return; }
  if (activeTab==='settings') { renderSettings(c); return; }

  const q = (document.getElementById('search-input').value||'').toLowerCase();
  let filtered = entries.filter(e => {
    const matchCat = activeCategory==='all' || e.category===activeCategory;
    const matchQ = !q || e.name.toLowerCase().includes(q) || e.username.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  if (filtered.length===0) {
    c.innerHTML = `<div class="empty">
      <div class="empty-icon">🔑</div>
      <div class="empty-title">Sin contraseñas guardadas</div>
      <div class="empty-sub">Toca + para agregar tu primera clave</div>
    </div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(e => { if(!grouped[e.category]) grouped[e.category]=[]; grouped[e.category].push(e); });

  let html='';
  Object.entries(grouped).forEach(([cat,items]) => {
    const ci = CATEGORIES[cat];
    html += `<div class="section-label">${ci.emoji} ${ci.label}</div>`;
    items.forEach(item => {
      const days = getDaysSince(item.updatedAt);
      let cls='ok', lbl='';
      if      (days>180) { cls='danger'; lbl=`⚠️ ${Math.floor(days/30)}m sin cambiar`; }
      else if (days>120) { cls='warn';   lbl=`${Math.floor(days/30)}m`; }
      else               { lbl = days<1?'Hoy': days===1?'Ayer':`Hace ${days}d`; }
      html += `<div class="pw-card" ontouchstart="openDetail('${item.id}')">
        <div class="pw-icon" style="background:${ci.color}1a;">${ci.emoji}</div>
        <div class="pw-info">
          <div class="pw-name">${escHtml(item.name)}</div>
          <div class="pw-user">${escHtml(item.username)}</div>
          <div class="pw-meta"><span class="pw-age ${cls}">${lbl}</span></div>
        </div>
        <div class="pw-chevron">›</div>
      </div>`;
    });
  });
  c.innerHTML = html;
}

function renderSecurity(c) {
  const expired = entries.filter(e => getDaysSince(e.updatedAt)>180);
  const warning = entries.filter(e => { const d=getDaysSince(e.updatedAt); return d>120&&d<=180; });
  const score = entries.length===0 ? 100 : Math.max(0, 100-(expired.length*20)-(warning.length*5));
  const col = score>=80?'#22c68a':score>=60?'#f5a623':'#ff4d6a';
  const lbl = score>=80?'Excelente':score>=60?'Mejorable':'Crítico';

  let html = `<div class="section-label">Salud de seguridad</div>
  <div class="security-score">
    <div class="score-ring" style="color:${col}">${score}<span style="font-size:24px;font-weight:400;">%</span></div>
    <div class="score-label">${lbl}</div>
    <div class="score-progress"><div class="score-progress-fill" style="width:${score}%;background:${col};"></div></div>
  </div>`;

  if (expired.length>0) {
    html += `<div class="section-label">⚠️ Requieren actualización</div>`;
    expired.forEach(e => {
      const d=getDaysSince(e.updatedAt);
      html += `<div class="sec-item" ontouchstart="openDetail('${e.id}')">
        <div class="sec-icon">🔑</div>
        <div class="sec-info"><div class="sec-name">${escHtml(e.name)}</div>
        <div class="sec-desc">Sin cambiar hace ${Math.floor(d/30)} meses</div></div>
        <span class="sec-badge bad">Actualizar</span>
      </div>`;
    });
  }

  html += `<div class="section-label">Protecciones activas</div>
  <div class="sec-item"><div class="sec-icon">🔐</div><div class="sec-info"><div class="sec-name">PIN de acceso</div><div class="sec-desc">Bloqueo de 4 dígitos activado</div></div><span class="sec-badge ok">Activo</span></div>
  <div class="sec-item"><div class="sec-icon">🛡️</div><div class="sec-info"><div class="sec-name">Cifrado local</div><div class="sec-desc">Datos cifrados en tu dispositivo</div></div><span class="sec-badge ok">Activo</span></div>
  <div class="sec-item"><div class="sec-icon">📵</div><div class="sec-info"><div class="sec-name">100% offline</div><div class="sec-desc">Sin servidores externos</div></div><span class="sec-badge ok">Activo</span></div>
  <div class="sec-item"><div class="sec-icon">🧹</div><div class="sec-info"><div class="sec-name">Auto-borrado</div><div class="sec-desc">Se borra tras ${MAX_ATTEMPTS} intentos fallidos</div></div><span class="sec-badge ok">Activo</span></div>
  <div class="sec-item"><div class="sec-icon">🔔</div><div class="sec-info"><div class="sec-name">Alertas de caducidad</div><div class="sec-desc">Aviso automático a los 6 meses</div></div><span class="sec-badge ok">Activo</span></div>`;

  c.innerHTML = html;
}

function renderSettings(c) {
  c.innerHTML = `
  <div class="section-label">Seguridad</div>
  <div class="sec-item" ontouchstart="openModal('pin-modal')">
    <div class="sec-icon">🔑</div>
    <div class="sec-info"><div class="sec-name">Cambiar PIN</div><div class="sec-desc">Modifica tu PIN de acceso</div></div>
    <div class="pw-chevron">›</div>
  </div>
  <div class="section-label">Recordatorios</div>
  <div class="sec-item">
    <div class="sec-icon">🔔</div>
    <div class="sec-info"><div class="sec-name">Alertar a los 6 meses</div><div class="sec-desc">Recordatorio de actualización</div></div>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
  </div>
  <div class="section-label">Datos</div>
  <div class="sec-item" ontouchstart="confirmWipe()">
    <div class="sec-icon">🗑️</div>
    <div class="sec-info"><div class="sec-name" style="color:var(--danger)">Borrar todos los datos</div><div class="sec-desc">Elimina todas las contraseñas guardadas</div></div>
  </div>
  <div class="section-label">Acerca de</div>
  <div class="sec-item">
    <div class="sec-icon">ℹ️</div>
    <div class="sec-info"><div class="sec-name">Vault v1.0</div><div class="sec-desc">Gestor local — sin servidor externo</div></div>
  </div>
  <div class="settings-info">
    🔒 <strong>Privacidad garantizada:</strong> Vault almacena tus contraseñas únicamente en este dispositivo. Nunca se envían a ningún servidor. Los datos se borran automáticamente tras ${MAX_ATTEMPTS} intentos de PIN incorrectos.
  </div>`;
}

// ── DETAIL ──
function openDetail(id) {
  const e = entries.find(x => x.id===id);
  if (!e) return;
  const ci = CATEGORIES[e.category];
  const days = getDaysSince(e.updatedAt);
  let ageInfo='', ageColor='var(--success)';
  if      (days>180) { ageInfo=`⚠️ Sin actualizar hace ${Math.floor(days/30)} meses`; ageColor='var(--danger)'; }
  else if (days>120) { ageInfo=`Actualizada hace ${Math.floor(days/30)} meses`;        ageColor='var(--warn)'; }
  else               { ageInfo=`Actualizada hace ${days<1?'hoy':days+' día'+(days!==1?'s':'')}`;  }

  const st = getStrength(e.password);
  document.getElementById('dm-title').textContent = e.name;
  document.getElementById('detail-body').innerHTML = `
    <div class="detail-icon" style="background:${ci.color}1a;">${ci.emoji}</div>
    <div class="detail-name">${escHtml(e.name)}</div>
    <div class="detail-cat">${ci.label}</div>
    <div class="detail-age" style="color:${ageColor}">${ageInfo}</div>

    <div class="detail-field">
      <div class="field-label">Usuario / Email</div>
      <div class="field-row">
        <div class="field-value" style="letter-spacing:normal;">${escHtml(e.username)}</div>
        <button class="field-btn" ontouchstart="copyText('${escAttr(e.username)}')">📋</button>
      </div>
    </div>

    <div class="detail-field">
      <div class="field-label">Contraseña</div>
      <div class="field-row">
        <div class="field-value hidden" id="pass-val">${escHtml(e.password)}</div>
        <button class="field-btn" ontouchstart="togglePass()" id="eye-btn">👁️</button>
        <button class="field-btn" ontouchstart="copyText('${escAttr(e.password)}')">📋</button>
      </div>
      <div class="strength-wrap">
        <div class="strength-bar ${st.cls}"></div>
        <span style="font-size:12px;color:var(--text2);white-space:nowrap;">${st.label}</span>
      </div>
    </div>

    ${e.notes ? `<div class="detail-field">
      <div class="field-label">Notas</div>
      <div class="field-row"><div class="field-value" style="letter-spacing:normal;">${escHtml(e.notes)}</div></div>
    </div>` : ''}

    <div class="detail-actions">
      <button class="action-btn primary" ontouchstart="openEdit('${e.id}')">✏️ Editar</button>
      <button class="action-btn danger-btn" ontouchstart="confirmDelete('${e.id}')">🗑️ Eliminar</button>
    </div>`;
  openModal('detail-modal');
}

let passVisible = false;
function togglePass() {
  passVisible = !passVisible;
  const v = document.getElementById('pass-val');
  v.className = passVisible ? 'field-value' : 'field-value hidden';
  document.getElementById('eye-btn').textContent = passVisible ? '🙈' : '👁️';
}

function copyText(text) {
  try { navigator.clipboard && navigator.clipboard.writeText(text); } catch(e) {}
  const t = document.getElementById('toast');
  t.className = 'copy-toast show';
  setTimeout(() => t.className='copy-toast', 2200);
}

// ── FORM ──
function openAdd() {
  document.getElementById('fm-title').textContent = 'Nueva clave';
  document.getElementById('f-id').value = '';
  ['f-name','f-user','f-pass','f-notes'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f-cat').value = 'bank';
  document.getElementById('strength-indicator').innerHTML = '';
  openModal('form-modal');
}

function openEdit(id) {
  const e = entries.find(x => x.id===id);
  if (!e) return;
  closeModal('detail-modal');
  document.getElementById('fm-title').textContent = 'Editar clave';
  document.getElementById('f-id').value    = id;
  document.getElementById('f-name').value  = e.name;
  document.getElementById('f-user').value  = e.username;
  document.getElementById('f-pass').value  = e.password;
  document.getElementById('f-notes').value = e.notes||'';
  document.getElementById('f-cat').value   = e.category;
  updateStrengthIndicator();
  setTimeout(() => openModal('form-modal'), 320);
}

function updateStrengthIndicator() {
  const pw = document.getElementById('f-pass').value;
  const c = document.getElementById('strength-indicator');
  if (!pw) { c.innerHTML=''; return; }
  const s = getStrength(pw);
  c.innerHTML = `<div class="strength-wrap" style="margin-top:8px;">
    <div class="strength-bar ${s.cls}"></div>
    <span style="font-size:12px;color:var(--text2);white-space:nowrap;">${s.label}</span>
  </div>`;
}

function getStrength(pw) {
  if (!pw) return { cls:'weak', label:'—' };
  let sc=0;
  if (pw.length>=8)  sc++;
  if (pw.length>=12) sc++;
  if (/[A-Z]/.test(pw)) sc++;
  if (/[0-9]/.test(pw)) sc++;
  if (/[^A-Za-z0-9]/.test(pw)) sc++;
  if (sc>=4) return { cls:'strong', label:'💪 Fuerte' };
  if (sc>=2) return { cls:'medium', label:'🟡 Media' };
  return { cls:'weak', label:'⚠️ Débil' };
}

function generatePass() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*()-_+=';
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  let pw = '';
  arr.forEach(b => pw += chars[b % chars.length]);
  const inp = document.getElementById('f-pass');
  inp.value = pw;
  inp.type = 'text';
  updateStrengthIndicator();
  setTimeout(() => { inp.type='password'; }, 4000);
}

function saveEntry() {
  const name     = document.getElementById('f-name').value.trim();
  const username = document.getElementById('f-user').value.trim();
  const password = document.getElementById('f-pass').value;
  const category = document.getElementById('f-cat').value;
  const notes    = document.getElementById('f-notes').value.trim();
  const editId   = document.getElementById('f-id').value;

  if (!name||!username||!password) { alert('Completa nombre, usuario y contraseña.'); return; }

  if (editId) {
    const idx = entries.findIndex(e=>e.id===editId);
    if (idx>=0) entries[idx] = { ...entries[idx], name, username, password, category, notes, updatedAt: new Date().toISOString() };
  } else {
    entries.push({ id:newId(), name, username, password, category, notes,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  }
  saveData();
  closeModal('form-modal');
  renderAll();
}

// ── DELETE ──
let pendingDeleteId = null;
function confirmDelete(id) {
  pendingDeleteId = id;
  document.getElementById('confirm-overlay').className='confirm-overlay open';
}
function closeConfirm() {
  pendingDeleteId=null;
  document.getElementById('confirm-overlay').className='confirm-overlay';
}
document.getElementById('confirm-ok-btn').ontouchstart = function() {
  if (!pendingDeleteId) return;
  entries = entries.filter(e=>e.id!==pendingDeleteId);
  saveData();
  closeConfirm();
  closeModal('detail-modal');
  renderAll();
};

function confirmWipe() {
  if (confirm('¿Borrar TODAS las contraseñas? Esta acción no se puede deshacer.')) {
    entries=[];
    saveData();
    renderAll();
  }
}

// ── CHANGE PIN ──
function changePin() {
  const cur  = document.getElementById('pin-current').value;
  const nw   = document.getElementById('pin-new').value;
  const conf = document.getElementById('pin-confirm').value;
  const err  = document.getElementById('pin-change-error');
  if (cur!==getPin())      { err.textContent='PIN actual incorrecto.'; return; }
  if (!/^\d{4}$/.test(nw)) { err.textContent='El nuevo PIN debe ser 4 dígitos.'; return; }
  if (nw!==conf)           { err.textContent='Los PINs no coinciden.'; return; }
  localStorage.setItem(PIN_KEY, nw);
  err.textContent='';
  closeModal('pin-modal');
  alert('✅ PIN cambiado correctamente.');
}

// ── MODALS ──
function openModal(id)  { document.getElementById(id).className='modal-overlay open'; passVisible=false; }
function closeModal(id) { document.getElementById(id).className='modal-overlay'; }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('touchstart', e => { if(e.target===el) closeModal(el.id); });
});

// ── UTILS ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

// ── INIT ──
loadData();
if (entries.length===0) {
  const old7 = new Date(); old7.setMonth(old7.getMonth()-7);
  const old4 = new Date(); old4.setMonth(old4.getMonth()-4);

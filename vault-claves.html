<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<meta name="theme-color" content="#0a0a0f">
<title>Vault</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--sur:#13131a;--c1:#1a1a24;--c2:#1f1f2e;
  --b1:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.14);
  --acc:#6c63ff;--acc2:#8b85ff;--gl:rgba(108,99,255,0.25);
  --tx:#f0f0f8;--tx2:#9494aa;--tx3:#5a5a72;
  --ok:#22c68a;--wn:#f5a623;--dg:#ff4d6a;
  --r:16px;--rs:10px;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}

/* LOCK */
#lock{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,rgba(108,99,255,0.2),var(--bg) 65%);padding:2rem}
.lico{width:90px;height:90px;border-radius:24px;background:linear-gradient(135deg,#6c63ff,#9f97ff);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:20px;box-shadow:0 0 50px rgba(108,99,255,0.45)}
.ltit{font-size:32px;font-weight:700;margin-bottom:6px}
.lsub{font-size:15px;color:var(--tx2);margin-bottom:8px}
.sync-status{font-size:12px;padding:4px 12px;border-radius:12px;margin-bottom:32px;font-weight:500}
.sync-status.online{background:rgba(34,198,138,0.15);color:var(--ok)}
.sync-status.offline{background:rgba(245,166,35,0.15);color:var(--wn)}
.pdots{display:flex;gap:20px;margin-bottom:36px}
.dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--b2);background:transparent;transition:all 0.2s}
.dot.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 14px var(--gl)}
.dot.sh{animation:sh 0.4s ease}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:300px}
.pkey{height:76px;border-radius:50%;background:var(--c1);border:0.5px solid var(--b2);color:var(--tx);font-size:26px;font-weight:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:all 0.14s;-webkit-user-select:none}
.pkey sub{font-size:9px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase}
.pkey:active{background:var(--acc);border-color:var(--acc);transform:scale(0.93)}
.pkey.del{background:transparent;border-color:transparent;color:var(--tx2);font-size:22px}
.pkey.zero{grid-column:2}
.perr{color:var(--dg);font-size:13px;min-height:18px;margin-top:14px;text-align:center}
.phint{color:var(--tx3);font-size:12px;margin-top:18px}

/* APP */
#app{display:none;position:fixed;inset:0;flex-direction:column}
#app.vis{display:flex}

/* SYNC INDICATOR */
.sync-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px;background:rgba(34,198,138,0.1);border-bottom:0.5px solid rgba(34,198,138,0.2);font-size:11px;color:var(--ok);flex-shrink:0}
.sync-bar.syncing{background:rgba(108,99,255,0.1);border-color:rgba(108,99,255,0.2);color:var(--acc2)}
.sync-bar.offline{background:rgba(245,166,35,0.1);border-color:rgba(245,166,35,0.2);color:var(--wn)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sync-dot.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.hdr{flex-shrink:0;padding:env(safe-area-inset-top,44px) 18px 0;background:rgba(10,10,15,0.93);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:0.5px solid var(--b1);z-index:10}
.hdrtop{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
.hdrtit{font-size:26px;font-weight:700;letter-spacing:-.5px}
.hdrbdg{background:rgba(108,99,255,0.15);border:0.5px solid rgba(108,99,255,0.4);color:var(--acc2);font-size:12px;padding:5px 12px;border-radius:20px}
.srch{display:flex;align-items:center;gap:10px;background:var(--c1);border:0.5px solid var(--b1);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.srch input{background:none;border:none;outline:none;color:var(--tx);font-size:16px;flex:1;font-family:inherit}
.srch input::placeholder{color:var(--tx3)}
.cats{display:flex;gap:9px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.chip{padding:10px 16px;border-radius:22px;font-size:14px;font-weight:500;border:0.5px solid var(--b1);background:var(--c1);cursor:pointer;white-space:nowrap;color:var(--tx2);display:flex;align-items:center;gap:7px;flex-shrink:0;-webkit-user-select:none}
.chip.on{color:var(--tx);border-color:var(--acc);background:rgba(108,99,255,0.16)}
.cdot{width:8px;height:8px;border-radius:50%}

.sarea{flex:1;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom,20px) + 96px)}

.alt{margin:14px 16px 0;background:rgba(245,166,35,0.1);border:0.5px solid rgba(245,166,35,0.35);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-user-select:none}
.adot{width:9px;height:9px;border-radius:50%;background:var(--wn);flex-shrink:0;animation:pulse 2s infinite}
.atxt{font-size:14px;color:var(--wn);flex:1;line-height:1.4}
.slbl{font-size:11px;color:var(--tx3);padding:18px 18px 8px;letter-spacing:.7px;text-transform:uppercase;font-weight:600}

.pwc{margin:0 14px 10px;background:var(--c1);border:0.5px solid var(--b1);border-radius:var(--r);padding:17px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;-webkit-user-select:none;min-height:78px;transition:background 0.12s}
.pwc:active{background:var(--c2)}
.pwico{width:54px;height:54px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.pwinf{flex:1;min-width:0}
.pwnm{font-size:16px;font-weight:600;margin-bottom:3px}
.pwus{font-size:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwmt{margin-top:6px}
.pwtag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:10px;font-weight:500}
.pwtag.ok{background:rgba(34,198,138,0.12);color:var(--ok)}
.pwtag.wn{background:rgba(245,166,35,0.12);color:var(--wn)}
.pwtag.dg{background:rgba(255,77,106,0.15);color:var(--dg)}
.pwchv{color:var(--tx3);font-size:22px;font-weight:200;padding-left:4px}

.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,20px) + 80px);width:60px;height:60px;border-radius:30px;background:var(--acc);border:none;color:white;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px var(--gl);cursor:pointer;z-index:20;transition:transform 0.15s}
.fab:active{transform:scale(0.9)}

.bnav{position:fixed;bottom:0;left:0;right:0;height:calc(env(safe-area-inset-bottom,20px) + 62px);background:rgba(19,19,26,0.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:0.5px solid var(--b1);display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;z-index:15}
.ntab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;cursor:pointer;-webkit-user-select:none;min-width:90px}
.ntico{font-size:26px}
.ntlbl{font-size:11px;color:var(--tx3);font-weight:500}
.ntab.on .ntlbl{color:var(--acc2)}

.mov{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:50;display:none;align-items:flex-end}
.mov.open{display:flex}
.msh{width:100%;background:var(--sur);border-radius:26px 26px 0 0;border-top:0.5px solid var(--b2);padding:10px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:su 0.28s cubic-bezier(0.32,0.72,0,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhndl{width:38px;height:5px;border-radius:3px;background:var(--b2);margin:0 auto 12px;flex-shrink:0}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px;border-bottom:0.5px solid var(--b1);flex-shrink:0}
.mtit{font-size:19px;font-weight:700}
.mclx{background:var(--c2);border:none;color:var(--tx2);width:34px;height:34px;border-radius:17px;cursor:pointer;font-size:15px;flex-shrink:0}
.mbody{padding:20px;overflow-y:scroll;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom,20px) + 24px)}

.dico{width:80px;height:80px;border-radius:22px;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.dnm{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.dcat{text-align:center;font-size:14px;color:var(--tx2);margin-bottom:6px}
.dage{text-align:center;font-size:14px;font-weight:600;margin-bottom:22px}
.dfld{margin-bottom:16px}
.dlbl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;font-weight:600}
.drow{display:flex;align-items:center;gap:6px;background:var(--c1);border:0.5px solid var(--b1);border-radius:var(--rs);padding:14px 16px;min-height:54px}
.dval{flex:1;font-size:15px;font-family:'Courier New',monospace;letter-spacing:1px;word-break:break-all}
.dval.blur{filter:blur(8px);-webkit-user-select:none}
.dbtn{background:var(--c2);border:0.5px solid var(--b1);border-radius:8px;color:var(--tx2);cursor:pointer;font-size:18px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dbtn:active{background:var(--acc);color:white}
.sbrw{display:flex;align-items:center;gap:8px;margin-top:8px}
.sbr{height:5px;border-radius:3px;flex:1}
.sbr.strong{background:linear-gradient(90deg,var(--ok),#0de88a)}
.sbr.medium{background:linear-gradient(90deg,var(--wn),#ffcc44)}
.sbr.weak{background:linear-gradient(90deg,var(--dg),#ff7a90)}
.dacts{display:flex;gap:12px;margin-top:24px}
.abtn{flex:1;padding:17px;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;border:none;min-height:56px}
.abtn.pri{background:var(--acc);color:white}
.abtn.pri:active{opacity:.85}
.abtn.del{background:rgba(255,77,106,0.1);border:0.5px solid rgba(255,77,106,0.3);color:var(--dg)}
.abtn.del:active{background:rgba(255,77,106,0.2)}

.ffld{margin-bottom:18px}
.flbl{font-size:14px;color:var(--tx2);margin-bottom:8px;display:block;font-weight:500}
.finp{width:100%;background:var(--c1);border:0.5px solid var(--b1);border-radius:var(--rs);padding:15px 16px;color:var(--tx);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;min-height:54px;transition:border-color 0.2s}
.finp:focus{border-color:var(--acc)}
.fsel{width:100%;background:var(--c1);border:0.5px solid var(--b1);border-radius:var(--rs);padding:15px 16px;color:var(--tx);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;min-height:54px}
.fpwr{display:flex;gap:10px}
.fpwr .finp{flex:1}
.gbtn{background:rgba(108,99,255,0.15);border:0.5px solid rgba(108,99,255,0.4);color:var(--acc2);padding:0 16px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;min-height:54px}
.gbtn:active{background:rgba(108,99,255,0.28)}
.svbtn{width:100%;padding:18px;border-radius:var(--r);background:var(--acc);border:none;color:white;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit;min-height:58px}
.svbtn:active{opacity:.88;transform:scale(.98)}

.scrd{margin:4px 16px 16px;background:var(--c1);border:0.5px solid var(--b1);border-radius:var(--r);padding:24px;text-align:center}
.scrng{font-size:56px;font-weight:200;margin-bottom:4px}
.sclbl{font-size:14px;color:var(--tx2)}
.scbar{margin-top:14px;height:7px;background:var(--c2);border-radius:4px}
.scfil{height:100%;border-radius:4px;transition:width .6s}
.sitm{margin:0 14px 10px;background:var(--c1);border:0.5px solid var(--b1);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;min-height:70px}
.sico{font-size:24px;width:40px;text-align:center;flex-shrink:0}
.sinf{flex:1}
.snm{font-size:15px;font-weight:600;margin-bottom:3px}
.sds{font-size:13px;color:var(--tx2);line-height:1.4}
.sbdg{font-size:12px;padding:5px 11px;border-radius:10px;font-weight:700;white-space:nowrap}
.sbdg.ok{background:rgba(34,198,138,0.12);color:var(--ok)}
.sbdg.bad{background:rgba(255,77,106,0.14);color:var(--dg)}
.sinf2{margin:12px 16px;padding:16px;background:rgba(108,99,255,0.08);border:0.5px solid rgba(108,99,255,0.2);border-radius:var(--r);font-size:13px;color:var(--tx2);line-height:1.8}
.tog{width:50px;height:30px;background:var(--acc);border-radius:15px;position:relative;flex-shrink:0}
.tthm{width:26px;height:26px;background:white;border-radius:13px;position:absolute;top:2px;right:2px;box-shadow:0 1px 4px rgba(0,0,0,0.3)}
.empty{text-align:center;padding:72px 24px;color:var(--tx3)}
.eico{font-size:56px;margin-bottom:16px}
.etit{font-size:18px;font-weight:600;color:var(--tx2);margin-bottom:8px}
.esub{font-size:14px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,20px) + 82px);left:50%;transform:translateX(-50%);background:var(--ok);color:white;padding:12px 24px;border-radius:24px;font-size:15px;font-weight:700;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.covl{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.covl.open{display:flex}
.cbox{background:var(--sur);border:0.5px solid var(--b2);border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center}
.ctit{font-size:18px;font-weight:700;margin-bottom:10px}
.cmsg{font-size:15px;color:var(--tx2);line-height:1.6;margin-bottom:24px}
.cbtns{display:flex;gap:12px}
.cbtn{flex:1;padding:16px;border-radius:var(--rs);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;border:none;min-height:54px}
.cbtn.can{background:var(--c2);color:var(--tx2)}
.cbtn.ok{background:var(--dg);color:white}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;color:var(--tx2)}
.spinner{width:36px;height:36px;border:3px solid var(--b2);border-top-color:var(--acc);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="lock">
  <div class="lico">🔐</div>
  <div class="ltit">Vault</div>
  <div class="lsub">Gestor seguro de contraseñas</div>
  <div class="sync-status online" id="lock-sync">🌐 Sincronización activa</div>
  <div class="pdots" id="pdots">
    <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  </div>
  <div class="pad">
    <button class="pkey" onclick="pp('1')">1</button>
    <button class="pkey" onclick="pp('2')">2<sub>ABC</sub></button>
    <button class="pkey" onclick="pp('3')">3<sub>DEF</sub></button>
    <button class="pkey" onclick="pp('4')">4<sub>GHI</sub></button>
    <button class="pkey" onclick="pp('5')">5<sub>JKL</sub></button>
    <button class="pkey" onclick="pp('6')">6<sub>MNO</sub></button>
    <button class="pkey" onclick="pp('7')">7<sub>PQRS</sub></button>
    <button class="pkey" onclick="pp('8')">8<sub>TUV</sub></button>
    <button class="pkey" onclick="pp('9')">9<sub>WXYZ</sub></button>
    <button class="pkey zero" onclick="pp('0')">0</button>
    <button class="pkey del" onclick="pd()">⌫</button>
  </div>
  <div class="perr" id="perr"></div>
  <div class="phint">PIN por defecto: 1234 · Cámbialo en Ajustes</div>
</div>

<div id="app">
  <div class="sync-bar" id="syncbar">
    <div class="sync-dot"></div>
    <span id="synctxt">Sincronizado ✓</span>
  </div>
  <div class="hdr">
    <div class="hdrtop">
      <div class="hdrtit">🔐 Vault</div>
      <div class="hdrbdg" id="badge">0 claves</div>
    </div>
    <div class="srch">
      <span style="font-size:16px;color:var(--tx3)">🔍</span>
      <input type="text" placeholder="Buscar..." id="sinput" oninput="renderList()">
    </div>
    <div class="cats" id="cats"></div>
  </div>
  <div class="sarea" id="sarea">
    <div id="altbx"></div>
    <div id="lstbx"></div>
  </div>
  <button class="fab" onclick="openAdd()">＋</button>
  <div class="bnav">
    <div class="ntab on" onclick="goTab('home')" id="t-home"><div class="ntico">🏠</div><div class="ntlbl">Inicio</div></div>
    <div class="ntab"    onclick="goTab('sec')"  id="t-sec" ><div class="ntico">🛡️</div><div class="ntlbl">Seguridad</div></div>
    <div class="ntab"    onclick="goTab('cfg')"  id="t-cfg" ><div class="ntico">⚙️</div><div class="ntlbl">Ajustes</div></div>
  </div>
</div>

<!-- MODALS -->
<div class="mov" id="m-det">
  <div class="msh">
    <div class="mhndl"></div>
    <div class="mhdr"><div class="mtit" id="m-dtit">Detalle</div><button class="mclx" onclick="cm('m-det')">✕</button></div>
    <div class="mbody" id="m-dbody"></div>
  </div>
</div>

<div class="mov" id="m-form">
  <div class="msh">
    <div class="mhndl"></div>
    <div class="mhdr"><div class="mtit" id="m-ftit">Nueva clave</div><button class="mclx" onclick="cm('m-form')">✕</button></div>
    <div class="mbody">
      <div class="ffld"><label class="flbl">Nombre del servicio</label><input class="finp" id="fn" type="text" placeholder="Ej: Banco Santander" autocomplete="off"></div>
      <div class="ffld"><label class="flbl">Usuario / Email</label><input class="finp" id="fu" type="text" placeholder="usuario@email.com" autocomplete="off" autocapitalize="none"></div>
      <div class="ffld">
        <label class="flbl">Contraseña</label>
        <div class="fpwr">
          <input class="finp" id="fp" type="password" placeholder="••••••••" autocomplete="new-password" oninput="updStr()">
          <button class="gbtn" onclick="genPw()">⚡ Generar</button>
        </div>
        <div id="stri"></div>
      </div>
      <div class="ffld">
        <label class="flbl">Categoría</label>
        <select class="fsel" id="fc">
          <option value="bank">🏦 Banco</option>
          <option value="tc">💳 Tarjeta de crédito</option>
          <option value="entertain">🎬 Entretenimiento</option>
          <option value="social">📱 Redes sociales</option>
          <option value="work">💼 Trabajo</option>
          <option value="other">🔑 Otro</option>
        </select>
      </div>
      <div class="ffld"><label class="flbl">Notas (opcional)</label><input class="finp" id="fnt" type="text" placeholder="Información adicional..." autocomplete="off"></div>
      <input type="hidden" id="fid">
      <button class="svbtn" onclick="saveEntry()">💾 Guardar y sincronizar</button>
    </div>
  </div>
</div>

<div class="mov" id="m-pin">
  <div class="msh">
    <div class="mhndl"></div>
    <div class="mhdr"><div class="mtit">Cambiar PIN</div><button class="mclx" onclick="cm('m-pin')">✕</button></div>
    <div class="mbody">
      <div class="ffld"><label class="flbl">PIN actual</label><input class="finp" id="pc" type="password" placeholder="••••" maxlength="4" inputmode="numeric"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── FIREBASE CONFIG ──
const firebaseConfig = {

// ── ENCRYPTION ──
// AES-256-GCM: encrypt before sending to Firebase, decrypt on load
async function getKey(pin) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin.padEnd(32,'0')), 'AES-GCM', false, ['encrypt','decrypt']);
  return keyMaterial;
}

async function encryptData(data, pin) {
  const key = await getKey(pin);
  const enc = new TextEncoder();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, enc.encode(JSON.stringify(data)));
  const buf = new Uint8Array(iv.length + ct.byteLength);
  buf.set(iv, 0);
  buf.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...buf));
}

async function decryptData(b64, pin) {
  try {
    const key = await getKey(pin);
    const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = buf.slice(0, 12);
    const ct = buf.slice(12);
    const dec = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
    return JSON.parse(new TextDecoder().decode(dec));
  } catch(e) { return null; }
}

// ── CONSTANTS ──
const CATS={bank:{label:'Banco',emoji:'🏦',color:'#6c63ff'},tc:{label:'Tarjeta crédito',emoji:'💳',color:'#f5a623'},entertain:{label:'Entretenimiento',emoji:'🎬',color:'#22c68a'},social:{label:'Redes sociales',emoji:'📱',color:'#e24b8a'},work:{label:'Trabajo',emoji:'💼',color:'#378add'},other:{label:'Otro',emoji:'🔑',color:'#888780'}};
const PK='vault_pin_v1', AK='vault_att', MAX=10;
let entries=[], tab='home', cat='all', delId=null, pviz=false;
let fa=parseInt(localStorage.getItem(AK)||'0');
let currentPin='';
let fbUnsubscribe=null;

// ── PIN ──
function getPin(){return localStorage.getItem(PK)||'1234';}
let pe='';

function pp(d){
  if(pe.length>=4)return;
  pe+=d; udots();
  if(pe.length===4){
    setTimeout(async ()=>{
      if(pe===getPin()){
        localStorage.setItem(AK,'0'); fa=0;
        currentPin=pe;
        document.getElementById('lock').style.display='none';
        document.getElementById('app').classList.add('vis');
        startSync();
      } else {
        fa++; localStorage.setItem(AK,fa);
        if(fa>=MAX){
          // wipe firebase too
          await remove(ref(db,'vault/entries'));
          localStorage.removeItem(PK); localStorage.removeItem(AK);
          document.getElementById('perr').textContent='⚠️ Datos borrados por seguridad.';
        } else {
          document.getElementById('perr').textContent='PIN incorrecto. '+(MAX-fa)+' intentos restantes.';
          document.querySelectorAll('.dot').forEach(x=>{x.classList.add('sh');setTimeout(()=>x.classList.remove('sh'),450);});
        }
        pe=''; udots();
      }
    },160);
  }
}
function pd(){if(pe.length>0){pe=pe.slice(0,-1);udots();}}
function udots(){for(let i=0;i<4;i++)document.getElementById('d'+i).className='dot'+(i<pe.length?' on':'');if(pe.length<4)document.getElementById('perr').textContent='';}

// ── SYNC ──
function setSyncStatus(state, msg){
  const bar=document.getElementById('syncbar');
  const txt=document.getElementById('synctxt');
  bar.className='sync-bar'+( state==='ok'?'': state==='syncing'?' syncing':' offline');
  const dot=bar.querySelector('.sync-dot');
  dot.className='sync-dot'+(state==='syncing'?' pulse':'');
  txt.textContent=msg;
}

function startSync(){
  setSyncStatus('syncing','Cargando datos...');
  document.getElementById('lstbx').innerHTML='<div class="loading"><div class="spinner"></div><span>Sincronizando...</span></div>';

  // Listen for online/offline
  window.addEventListener('online', ()=>setSyncStatus('ok','Sincronizado ✓'));
  window.addEventListener('offline', ()=>setSyncStatus('offline','Sin conexión — usando datos locales'));

  // Real-time listener
  const entriesRef = ref(db, 'vault/entries');
  fbUnsubscribe = onValue(entriesRef, async (snapshot) => {
    const data = snapshot.val();
    if(data && data.encrypted){
      const dec = await decryptData(data.encrypted, currentPin);
      if(dec !== null){
        entries = dec;
        // also cache locally
        try{localStorage.setItem('vault_cache', JSON.stringify(entries));}catch(e){}
        setSyncStatus('ok','Sincronizado ✓');
        renderAll();
      } else {
        // Wrong pin or no data yet
        entries = loadCache();
        setSyncStatus('ok','Datos locales');
        renderAll();
      }
    } else {
      // No data in Firebase yet — load cache or empty
      entries = loadCache();
      setSyncStatus('ok', entries.length>0?'Datos locales':'Listo');
      renderAll();
    }
  }, (error) => {
    console.error(error);
    entries = loadCache();
    setSyncStatus('offline','Sin conexión — usando datos locales');
    renderAll();
  });
}

function loadCache(){
  try{const r=localStorage.getItem('vault_cache');if(r)return JSON.parse(r);}catch(e){}
  return [];
}

async function saveToFirebase(){
  setSyncStatus('syncing','Guardando...');
  try{
    const encrypted = await encryptData(entries, currentPin);
    await set(ref(db,'vault/entries'), {encrypted, updatedAt: Date.now()});
    // also update local cache
    try{localStorage.setItem('vault_cache', JSON.stringify(entries));}catch(e){}
    setSyncStatus('ok','Sincronizado ✓');
  } catch(e){
    setSyncStatus('offline','Error al sincronizar');
    // save locally anyway
    try{localStorage.setItem('vault_cache', JSON.stringify(entries));}catch(e){}
  }
}

// ── HELPERS ──
function dsin(d){return Math.floor((Date.now()-new Date(d).getTime())/86400000);}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ea(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

// ── TABS ──
function goTab(t){tab=t;['home','sec','cfg'].forEach(x=>document.getElementById('t-'+x).className='ntab'+(x===t?' on':''));document.getElementById('sarea').scrollTop=0;renderAll();}
window.goTab=goTab;

function renderAll(){renderAlt();renderCats();renderList();updBadge();}

function renderAlt(){

}

function renderCats(){
  const c=document.getElementById('cats');
  if(tab!=='home'){c.innerHTML='';return;}
  let h=`<div class="chip${cat==='all'?' on':''}" onclick="setCat('all')">Todas</div>`;
  Object.entries(CATS).forEach(([k,v])=>{if(entries.some(e=>e.category===k))h+=`<div class="chip${cat===k?' on':''}" onclick="setCat('${k}')"><span class="cdot" style="background:${v.color}"></span>${v.emoji} ${v.label}</div>`;});

function renderList(){
  const b=document.getElementById('lstbx');
  if(tab==='sec'){renderSec(b);return;}
  if(tab==='cfg'){renderCfg(b);return;}
  const q=(document.getElementById('sinput').value||'').toLowerCase();
  let fl=entries.filter(e=>(cat==='all'||e.category===cat)&&(!q||e.name.toLowerCase().includes(q)||e.username.toLowerCase().includes(q)));
  if(!fl.length){b.innerHTML=`<div class="empty"><div class="eico">🔑</div><div class="etit">Sin contraseñas</div><div class="esub">Toca ＋ para agregar tu primera clave</div></div>`;return;}
  const grp={};
  fl.forEach(e=>{if(!grp[e.category])grp[e.category]=[];grp[e.category].push(e);});
  let h='';
  Object.entries(grp).forEach(([k,items])=>{
    const ci=CATS[k];
    h+=`<div class="slbl">${ci.emoji} ${ci.label}</div>`;

      const d=dsin(it.updatedAt);
      let cls='ok',lbl='';
      if(d>180){cls='dg';lbl=`⚠️ ${Math.floor(d/30)}m sin cambiar`;}
      else if(d>120){cls='wn';lbl=`${Math.floor(d/30)} meses`;}
      else{lbl=d<1?'Hoy':d===1?'Ayer':`Hace ${d}d`;}
      h+=`<div class="pwc" onclick="openDetail('${it.id}')"><div class="pwico" style="background:${ci.color}18">${ci.emoji}</div><div class="pwinf"><div class="pwnm">${esc(it.name)}</div><div class="pwus">${esc(it.username)}</div><div class="pwmt"><span class="pwtag ${cls}">${lbl}</span></div></div><div class="pwchv">›</div></div>`;
    });
  });
  b.innerHTML=h;
}

function renderSec(b){
  const ex=entries.filter(e=>dsin(e.updatedAt)>180);

  let h=`<div class="slbl">Salud de seguridad</div><div class="scrd"><div class="scrng" style="color:${col}">${sc}<span style="font-size:24px;font-weight:400">%</span></div><div class="sclbl">${lbl}</div><div class="scbar"><div class="scfil" style="width:${sc}%;background:${col}"></div></div></div>`;
  if(ex.length){h+=`<div class="slbl">⚠️ Requieren actualización</div>`;ex.forEach(e=>{const d=dsin(e.updatedAt);h+=`<div class="sitm" onclick="openDetail('${e.id}')"><div class="sico">🔑</div><div class="sinf"><div class="snm">${esc(e.name)}</div><div class="sds">Sin cambiar hace ${Math.floor(d/30)} meses</div></div><span class="sbdg bad">Actualizar</span></div>`;});}
  h+=`<div class="slbl">Protecciones activas</div>
  <div class="sitm"><div class="sico">🔐</div><div class="sinf"><div class="snm">PIN de acceso</div><div class="sds">Bloqueo de 4 dígitos</div></div><span class="sbdg ok">Activo</span></div>
  <div class="sitm"><div class="sico">🛡️</div><div class="sinf"><div class="snm">Cifrado AES-256-GCM</div><div class="sds">Datos cifrados antes de salir del dispositivo</div></div><span class="sbdg ok">Activo</span></div>
  <div class="sitm"><div class="sico">☁️</div><div class="sinf"><div class="snm">Sincronización cifrada</div><div class="sds">Firebase solo recibe datos ilegibles</div></div><span class="sbdg ok">Activo</span></div>
  <div class="sitm"><div class="sico">📵</div><div class="sinf"><div class="snm">Modo offline</div><div class="sds">Funciona sin internet con caché local</div></div><span class="sbdg ok">Activo</span></div>
  <div class="sitm"><div class="sico">🧹</div><div class="sinf"><div class="snm">Auto-borrado</div><div class="sds">Tras ${MAX} intentos fallidos</div></div><span class="sbdg ok">Activo</span></div>
  <div class="sitm"><div class="sico">🔔</div><div class="sinf"><div class="snm">Alertas de caducidad</div><div class="sds">Aviso a los 6 meses</div></div><span class="sbdg ok">Activo</span></div>`;
  b.innerHTML=h;
}

function renderCfg(b){
  b.innerHTML=`
  <div class="slbl">Seguridad</div>
  <div class="sitm" onclick="om('m-pin')"><div class="sico">🔑</div><div class="sinf"><div class="snm">Cambiar PIN</div><div class="sds">Modifica tu clave de acceso</div></div><div class="pwchv">›</div></div>
  <div class="slbl">Sincronización</div>
  <div class="sitm"><div class="sico">☁️</div><div class="sinf"><div class="snm">Firebase Realtime DB</div><div class="sds">Sincronización en tiempo real activa</div></div><span class="sbdg ok">Activo</span></div>
  <div class="slbl">Recordatorios</div>
  <div class="sitm"><div class="sico">🔔</div><div class="sinf"><div class="snm">Alertar a los 6 meses</div><div class="sds">Recordatorio de actualización</div></div><div class="tog"><div class="tthm"></div></div></div>
  <div class="slbl">Datos</div>
  <div class="sitm" onclick="wipeAll()"><div class="sico">🗑️</div><div class="sinf"><div class="snm" style="color:var(--dg)">Borrar todos los datos</div><div class="sds">Elimina local y en la nube</div></div></div>
  <div class="slbl">Acerca de</div>

  <div class="sinf2">🔒 <strong>Cifrado de extremo a extremo:</strong> Tus contraseñas se cifran con AES-256-GCM en tu dispositivo antes de enviarse. Firebase solo almacena datos ilegibles. Ni Google ni nadie puede leer tus contraseñas sin tu PIN.</div>`;

// ── DETAIL ──
window.openDetail=function(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  const ci=CATS[e.category];const d=dsin(e.updatedAt);
  let ai='',ac='var(--ok)';
  if(d>180){ai=`⚠️ Sin actualizar hace ${Math.floor(d/30)} meses`;ac='var(--dg)';}
  else if(d>120){ai=`Actualizada hace ${Math.floor(d/30)} meses`;ac='var(--wn)';}
  else{ai=`Actualizada hace ${d<1?'hoy':d+' día'+(d!==1?'s':'')}`;}
  const st=strn(e.password);pviz=false;
  document.getElementById('m-dtit').textContent=e.name;
  document.getElementById('m-dbody').innerHTML=`
    <div class="dico" style="background:${ci.color}18">${ci.emoji}</div>
    <div class="dnm">${esc(e.name)}</div><div class="dcat">${ci.label}</div>
    <div class="dage" style="color:${ac}">${ai}</div>
    <div class="dfld"><div class="dlbl">Usuario / Email</div>
    <div class="drow"><div class="dval" style="letter-spacing:normal">${esc(e.username)}</div><button class="dbtn" onclick="cp('${ea(e.username)}')">📋</button></div></div>
    <div class="dfld"><div class="dlbl">Contraseña</div>
    <div class="drow"><div class="dval blur" id="pv">${esc(e.password)}</div>
    <button class="dbtn" onclick="tgPv()" id="eyb">👁️</button>
    <button class="dbtn" onclick="cp('${ea(e.password)}')">📋</button></div>
    <div class="sbrw"><div class="sbr ${st.c}"></div><span style="font-size:13px;color:var(--tx2)">${st.l}</span></div></div>
    ${e.notes?`<div class="dfld"><div class="dlbl">Notas</div><div class="drow"><div class="dval" style="letter-spacing:normal">${esc(e.notes)}</div></div></div>`:''}
    <div class="dacts">
      <button class="abtn pri" onclick="openEdit('${e.id}')">✏️ Editar</button>
      <button class="abtn del" onclick="cDel('${e.id}')">🗑️ Eliminar</button>
    </div>`;
  om('m-det');
}

window.tgPv=function(){pviz=!pviz;document.getElementById('pv').className='dval'+(pviz?'':' blur');document.getElementById('eyb').textContent=pviz?'🙈':'👁️';}

window.openAdd=function(){
  document.getElementById('m-ftit').textContent='Nueva clave';
  document.getElementById('fid').value='';
  ['fn','fu','fp','fnt'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fc').value='bank';
  document.getElementById('stri').innerHTML='';
  om('m-form');
}
window.openEdit=function(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  cm('m-det');
  document.getElementById('m-ftit').textContent='Editar clave';
  document.getElementById('fid').value=id;
  document.getElementById('fn').value=e.name;
  document.getElementById('fu').value=e.username;
  document.getElementById('fp').value=e.password;
  document.getElementById('fnt').value=e.notes||'';
  document.getElementById('fc').value=e.category;
  updStr();setTimeout(()=>om('m-form'),300);
}
window.updStr=function(){const pw=document.getElementById('fp').value;const c=document.getElementById('stri');if(!pw){c.innerHTML='';return;}const s=strn(pw);c.innerHTML=`<div class="sbrw" style="margin-top:10px"><div class="sbr ${s.c}"></div><span style="font-size:13px;color:var(--tx2)">${s.l}</span></div>`;}
function strn(pw){if(!pw)return{c:'weak',l:'—'};let sc=0;if(pw.length>=8)sc++;if(pw.length>=12)sc++;if(/[A-Z]/.test(pw))sc++;if(/[0-9]/.test(pw))sc++;if(/[^A-Za-z0-9]/.test(pw))sc++;if(sc>=4)return{c:'strong',l:'💪 Fuerte'};if(sc>=2)return{c:'medium',l:'🟡 Media'};return{c:'weak',l:'⚠️ Débil'};}
window.genPw=function(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*()-_+=';const a=new Uint8Array(16);crypto.getRandomValues(a);let pw='';a.forEach(b=>pw+=ch[b%ch.length]);const i=document.getElementById('fp');i.value=pw;i.type='text';updStr();setTimeout(()=>i.type='password',4000);}

window.saveEntry=async function(){
  const name=document.getElementById('fn').value.trim();
  const user=document.getElementById('fu').value.trim();
  const pass=document.getElementById('fp').value;
  const catv=document.getElementById('fc').value;
  const note=document.getElementById('fnt').value.trim();
  const eid=document.getElementById('fid').value;
  if(!name||!user||!pass){alert('Completa nombre, usuario y contraseña.');return;}
  if(eid){const i=entries.findIndex(e=>e.id===eid);if(i>=0)entries[i]={...entries[i],name,username:user,password:pass,category:catv,notes:note,updatedAt:new Date().toISOString()};}
  else{entries.push({id:uid(),name,username:user,password:pass,category:catv,notes:note,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});}
  cm('m-form');renderAll();
  await saveToFirebase();
}

// ── DELETE ──
window.cDel=function(id){delId=id;document.getElementById('covl').className='covl open';}
window.cclose=function(){delId=null;document.getElementById('covl').className='covl';}
document.getElementById('cok').onclick=async function(){
  if(!delId)return;
  entries=entries.filter(e=>e.id!==delId);
  cclose();cm('m-det');renderAll();
  await saveToFirebase();
};
window.wipeAll=async function(){
  if(confirm('¿Borrar TODAS las contraseñas? Se eliminará local y en la nube.')){
    entries=[];
    await set(ref(db,'vault/entries'), null);
    localStorage.removeItem('vault_cache');
    renderAll();
  }
}

// ── PIN CHANGE ──
window.chPin=async function(){
  const cur=document.getElementById('pc').value,nw=document.getElementById('pn').value,cf=document.getElementById('pk').value,err=document.getElementById('perr2');
  if(cur!==getPin()){err.textContent='PIN actual incorrecto.';return;}
  if(!/^\d{4}$/.test(nw)){err.textContent='El PIN debe ser 4 dígitos.';return;}
  if(nw!==cf){err.textContent='Los PINs no coinciden.';return;}
  // Re-encrypt with new PIN
  currentPin=nw;
  localStorage.setItem(PK,nw);
  err.textContent='';
  cm('m-pin');
  await saveToFirebase();
  alert('✅ PIN cambiado y datos re-cifrados.');
}

// ── MODALS ──
window.om=function(id){document.getElementById(id).className='mov open';pviz=false;}
window.cm=function(id){document.getElementById(id).className='mov';}
document.querySelectorAll('.mov').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)cm(el.id);}));

// ── CHECK ONLINE STATUS ──
if(!navigator.onLine){
  document.getElementById('lock-sync').className='sync-status offline';
  document.getElementById('lock-sync').textContent='📴 Sin conexión — modo offline';
}

// expose pp/pd globally
window.pp=pp; window.pd=pd;
</script>
